name: dawa_hayah
description: Dawa and Hayah educational Android application
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  drift: ^2.28.0
  sqlite3: ^2.7.6
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.4.0
  crypto: ^3.0.6
  connectivity_plus: ^6.1.5
  webview_flutter: ^4.13.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/models/sample/
    - assets/viewer/
