name: Foundation and medical knowledge gates
on:
  push:
    branches: [stage-01-neon-offline-foundation, stage-02-medical-knowledge-sources, main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: dawa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:localtest@localhost:5432/dawa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm --prefix backend test
      - run: npm --prefix backend audit --audit-level=high
      - run: PGPASSWORD=localtest psql -h localhost -U postgres -d dawa_test -c 'CREATE ROLE dawa_owner;'
      - run: node scripts/migrate.mjs
      - run: node scripts/migrate.mjs
      - run: node scripts/seed.mjs
      - run: PGPASSWORD=localtest psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dawa_test -f backend/test/database.sql
      - run: node scripts/seed_sources.mjs
      - run: PGPASSWORD=localtest psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d dawa_test -f backend/test/knowledge_database.sql
      - run: python3 scripts/build_medical_pack.py && git diff --exit-code backend/storage
      - run: node scripts/knowledge_policy_lint.mjs
      - run: python3 scripts/security_scan.py
      - run: python3 scripts/check_release_policy.py
      - run: node scripts/bundle.mjs
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - working-directory: app
        run: flutter analyze
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - working-directory: app
        run: flutter test
  internal-android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      # Compile only. Do not upload APKs or create Releases before Stage 5.
      - working-directory: app
        run: flutter build apk --release --target-platform android-arm64
  live-neon-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live_smoke.py
      - run: python3 scripts/knowledge_live_smoke.py
      - run: API_BASE_URL=https://br-noisy-poetry-bats6www-api.compute.c-8.eu-central-1.aws.neon.tech python3 scripts/live_smoke.py
