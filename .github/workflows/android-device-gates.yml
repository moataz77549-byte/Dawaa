name: Android device gates (no APK distribution)
on:
  workflow_dispatch:
  push:
    branches: [stage-01-neon-offline-foundation]
    paths: ['app/**', '.github/workflows/android-device-gates.yml']
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Enable KVM for CI emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: app
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            flutter test integration_test/offline_test.dart
            adb shell svc wifi enable
            adb shell svc data enable
            flutter test integration_test/neon_download_test.dart
            adb shell svc wifi disable
            adb shell svc data disable
            flutter test integration_test/downloaded_offline_test.dart
